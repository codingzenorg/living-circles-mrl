root = "."
tmp_dir = "tmp/air"

[build]
cmd = "go build -o ./tmp/air/livingcircles ./src/server/cmd/livingcircles"
bin = "./tmp/air/livingcircles"
full_bin = "./tmp/air/livingcircles"
include_ext = ["go"]
include_dir = ["src/server", "tests"]
exclude_dir = ["tmp", "node_modules", ".git"]
delay = 200
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[color]
main = "yellow"
watcher = "cyan"
build = "green"
runner = "magenta"

[screen]
clear_on_rebuild = true
