<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Living Circles</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe7;
        --panel: #fffaf2;
        --ink: #17313a;
        --accent: #d85f3d;
        --circle: #3b8ea5;
        --line: #d9cbb7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top right, rgba(216, 95, 61, 0.18), transparent 28%),
          linear-gradient(180deg, var(--bg), #e8dcc9);
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
      }

      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px;
      }

      .panel {
        background: rgba(255, 250, 242, 0.92);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 18px 40px rgba(23, 49, 58, 0.08);
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 0.95;
      }

      p {
        margin: 0 0 18px;
        max-width: 62ch;
      }

      .hud {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 0 0 16px;
        align-items: center;
      }

      .chip {
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(23, 49, 58, 0.06);
        border: 1px solid var(--line);
        font-size: 0.95rem;
      }

      .control {
        appearance: none;
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, #fff7ee, #f0dfcb);
        color: var(--ink);
        font: inherit;
        font-size: 0.95rem;
        cursor: pointer;
      }

      .control:hover {
        background: linear-gradient(180deg, #fff1e5, #ecd5bb);
      }

      canvas {
        width: 100%;
        max-width: 800px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background:
          linear-gradient(180deg, rgba(59, 142, 165, 0.12), rgba(23, 49, 58, 0.02)),
          #fff;
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>Living Circles</h1>
        <p>
          One circle, one authoritative server, one bounded world. Use the arrow keys or WASD
          to move and watch energy drain from server-approved movement.
        </p>
        <div class="hud">
          <div class="chip" id="status">Connecting...</div>
          <div class="chip" id="energy">Energy: --</div>
          <div class="chip" id="tick">Tick: --</div>
          <button class="control" id="reset" type="button">Restart World</button>
        </div>
        <canvas id="world" width="800" height="600"></canvas>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
