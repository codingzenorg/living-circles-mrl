<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Living Circles</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07141a;
        --bg-deep: #02080c;
        --panel: rgba(10, 25, 33, 0.88);
        --ink: #e4f3f8;
        --muted: #9cb8c0;
        --accent: #ff8a5b;
        --line: rgba(126, 166, 178, 0.22);
        --glow: rgba(111, 213, 255, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top right, rgba(255, 138, 91, 0.16), transparent 24%),
          radial-gradient(circle at bottom left, rgba(92, 170, 196, 0.14), transparent 28%),
          linear-gradient(180deg, var(--bg), var(--bg-deep));
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
      }

      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(10px);
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 0.95;
      }

      p {
        margin: 0 0 18px;
        max-width: 62ch;
        color: var(--muted);
      }

      .hud {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 0 0 16px;
        align-items: center;
      }

      .chip {
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(111, 213, 255, 0.08);
        border: 1px solid var(--line);
        font-size: 0.95rem;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
      }

      .control {
        appearance: none;
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, #163544, #0d222c);
        color: var(--ink);
        font: inherit;
        font-size: 0.95rem;
        cursor: pointer;
      }

      .control:hover {
        background: linear-gradient(180deg, #1b4355, #102a35);
      }

      canvas {
        width: 100%;
        max-width: 800px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background:
          radial-gradient(circle at top, rgba(111, 213, 255, 0.12), transparent 45%),
          linear-gradient(180deg, rgba(13, 40, 52, 0.94), rgba(5, 16, 22, 0.98)),
          #07141a;
        display: block;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02), 0 20px 50px rgba(0, 0, 0, 0.28);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>Living Circles</h1>
        <p>
          One circle, one authoritative server, one bounded world. Use the arrow keys or WASD
          to move and watch energy drain from server-approved movement.
        </p>
        <div class="hud">
          <div class="chip" id="status">Connecting...</div>
          <div class="chip" id="energy">Energy: --</div>
          <div class="chip" id="tick">Tick: --</div>
          <button class="control" id="reset" type="button">Restart World</button>
        </div>
        <canvas id="world" width="800" height="600"></canvas>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
